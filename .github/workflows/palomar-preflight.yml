# Palomar's mechanical preflight (https://submit.palomar-registry.org/llms.txt, "Mechanical preflight"): runs
# PalomarRegistry/PalomarSubmission's reusable workflow in full mode on one commit. Manual only. Both the `uses`
# reference and `pipeline_commit` are pinned to the same PalomarSubmission commit (main on 2026-10-28). The
# repository must be public for the preflight to run. Submit only after the report says `status: pass`.
name: Palomar preflight

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Full 40-character commit to preflight (default: the dispatched ref's commit)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ inputs.commit != '' && inputs.commit || github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
