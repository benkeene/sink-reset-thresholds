project:
  name: "Sharp reset thresholds for bounded-response synchronization games with a sink"
  description: "Lean 4 / Mathlib statements of the theorem M(n,k) = sum_{i=1}^{n-1} ceil(i/k) for k = 1 or n <= k+3 (Lipin-Volkov k-game on automata with a sink), rendered as an upper and a lower bound, with the headline case M(5,2) = 6; proofs are to be supplied by the conductor formalize run."
  authors:
