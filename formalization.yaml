status:
  scope: >-
    The four statements of record are stated in Challenge.lean, whose record bodies are deliberate sorry
    placeholders checked against Solution.lean by the comparator, and proved in Solution.lean, each by one term
    naming its _dev copy in SinkReset.Plan (the development library, 2100 lines, no sorry). Not formalized:
    M(n,k) as a supremum, the Lipin-Volkov conjecture and its ceiling-sum form beyond k = 1 or n <= k+3, the
    prose equivalence of AliceWins with a winning strategy (CORRESPONDENCE.md section 3), and PROOF.md
    Appendix A (computation). Build and audit: CORRESPONDENCE.md section 8, quoted rows (lake build,
    axiom sweep, leanchecker, structural fidelity EQUAL, per-record axioms), with the commit each ran at.
  # Challenge.lean's four deliberate record placeholders; Solution.lean and SinkReset have no sorry
  sorry_count: 4
  sorry_in_definitions: 0
  axioms: ["Classical.choice", "Quot.sound", "propext"]
  main_results:
    - "SinkReset.reset_word_le_of_isAk"
    - "SinkReset.exists_isAk_reset_ge"
    - "SinkReset.five_two_reset_word_le"
    - "SinkReset.five_two_exists_isAk_reset_ge"

fidelity:
  divergences: >-
    (1) M(n,k) is not defined; "M(n,k) = f_k(n)" is rendered as the pair: every n-state A_k automaton with
    sink has a reset word of length <= f k n, and some n-state A_k automaton with sink has no reset word
    shorter than f k n. (2) The alphabet is any Set of transformations of Fin n fixing 0 (finite because
    Fin n -> Fin n is finite); letters are identified with their transformations. (3) A_k is the inductive
    predicate Automaton.AliceWins (Alice moves first; the attractor of the finite reachability game) rather
    than an explicit strategy function; PROOF.md Lemma 1(a) is built in. (4) ceil(i/k) is (i + k - 1) / k in
    natural-number division, valid for k >= 1, and the hypotheses 1 <= k and (for the lower bound) 2 <= n are
    explicit; [NeZero n] gives the sink 0 : Fin n. See CORRESPONDENCE.md sections 3 to 5.

sources:
  - title: "Sharp reset thresholds for bounded-response synchronization games with a sink (proof of record, unpublished; docs/PROOF.md)"
    authors: ["Ben Keene"]
    type: "original-proof"
    relationship: other
    note: >-
      Proof text written by Claude Opus (conductor prove run 2026-10-24_prove-claim-0001, job att-1) from the
      conjectured claim; three adversary rounds and three reviewer rounds by GPT-6 Astra (all findings minor,
      repaired); an independent GPT-6 Astra proof (ind-1) and a fresh isolated re-proof (rep-1), both PROVED;
      Opus comparison AGREES; joint judgment Opus ACCEPT 0.96, Astra ACCEPT 0.98; approved VERIFIED by Ben Keene
      on 2026-10-25 (lab claim_0001). No external human review.
  - title: "Adversarial Synchronization"
    authors: ["Anton E. Lipin", "Mikhail V. Volkov"]
    type: "article"
    id: "https://arxiv.org/abs/2601.18362"
    relationship: background
    note: >-
      Defines the k-game and A_k automata (section 2.1), proves M(n,1) = n(n-1)/2 and M(n,n-1) = n-1, exhibits the
      automata L_m^k with reset threshold sum_{i=1}^{n-1} ceil(i/k), and conjecture (section 3.4) that
      M(n,k) = (n-1+k)(n-1)/(2k) whenever k divides n-1 (which equals the ceiling sum there). The statements of
      record settle the conjecture's cases with k | n-1 and (k = 1 or n <= k+3), and the stronger ceiling-sum
      form, which Lipin-Volkov do not conjecture, for every k = 1 or n <= k+3.
  - title: "Adversarial Synchronization and Reset Length (CiE 2026)"
    authors: ["Anton E. Lipin", "Mikhail V. Volkov"]
    type: "article"
    id: "https://doi.org/10.1007/978-3-032-31348-5_24"
    relationship: background
    note: >-
      Conference version; not inspected in full text (PROOF.md Appendix B item 1).

